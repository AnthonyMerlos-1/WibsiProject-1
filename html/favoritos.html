<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../assets/img/favoritos.png" type="image/png">
    <title>Favoritos - WIBSIPROJECT</title>
    <!-- Fuentes y librerías adicionales para íconos interactivos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050508;
            color: #f0f0f0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(135deg, #050508, #11111d, #1a0b2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #canvas3d {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Barra superior de navegación mejorada */
        .top-nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2.5rem;
            z-index: 1000;
            background: rgba(5, 5, 8, 0.4);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1.3rem;
            background: linear-gradient(135deg, #00d2ff, #9b51e0, #ff007f);
            background-size: 200% 200%;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
            animation: colorShift 5s ease infinite, pulseGlow 2s infinite alternate;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
        }

        @keyframes colorShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); }
            to { box-shadow: 0 0 22px rgba(255, 0, 127, 0.6); }
        }

        .btn-home:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 8px 25px rgba(155, 81, 224, 0.7);
        }

        /* Controles extra en barra superior (Buscador y botón de limpiar todos) */
        .nav-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem 0.5rem 2.4rem;
            border-radius: 20px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            width: 200px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            width: 260px;
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .search-box i {
            position: absolute;
            left: 10px;
            color: #a0a0c0;
            font-size: 0.9rem;
        }

        .btn-action-global {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d0d0e0;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-action-global:hover {
            background: rgba(255, 0, 127, 0.15);
            border-color: rgba(255, 0, 127, 0.4);
            color: #fff;
            transform: translateY(-2px);
        }

        header {
            text-align: center;
            padding: 8rem 1rem 2rem 1rem;
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: 3.2rem;
            background: linear-gradient(45deg, #00d2ff, #9b51e0, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.8rem;
            letter-spacing: -1px;
        }

        header p {
            font-size: 1.15rem;
            color: #a0a0c0;
            max-width: 650px;
            margin: 0 auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 2rem;
            position: relative;
            z-index: 2;
            width: 100%;
            flex: 1;
        }

        /* Panel de pestañas de categoría interactivo */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(18, 18, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            color: #a0a0c0;
            cursor: pointer;
            font-size: 0.95rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            color: #fff;
            border-color: rgba(0, 210, 255, 0.4);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(155, 81, 224, 0.2));
            border-color: #00d2ff;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.8rem;
        }

        /* Tarjeta altamente interactiva con Glassmorphism avanzado */
        .fav-card {
            background: rgba(18, 18, 30, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.4s ease, box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: cardEntrance 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00d2ff, #ff007f);
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .fav-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: rgba(255, 0, 127, 0.4);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 0, 127, 0.15);
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .fav-card h3 {
            font-size: 1.4rem;
            color: #ffffff;
            font-weight: 600;
        }

        .category-tag {
            font-size: 0.75rem;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .fav-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #c0c0d0;
            margin-bottom: 1.8rem;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1rem;
        }

        .btn-visit {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.3s ease;
        }

        .btn-visit:hover {
            background: #00d2ff;
            color: #050508;
            border-color: #00d2ff;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        .heart-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ff007f;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heart-btn:hover {
            transform: scale(1.15) rotate(10deg);
            background: rgba(255, 0, 127, 0.2);
            border-color: #ff007f;
        }

        .heart-btn.active {
            background: #ff007f;
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.8);
            animation: heartBeat 0.4s ease;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* Estado vacío interactivo */
        .empty-state {
            text-align: center;
            grid-column: 1 / -1;
            padding: 5rem 2rem;
            background: rgba(18, 18, 30, 0.4);
            border-radius: 24px;
            border: 1px dashed rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        .empty-state i {
            font-size: 3.5rem;
            color: #ff007f;
            margin-bottom: 1rem;
            animation: pulseGlow 2s infinite alternate;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: #9090b0;
            font-size: 1rem;
            max-width: 450px;
            margin: 0 auto 1.5rem auto;
            line-height: 1.5;
        }

        .btn-explore {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #00d2ff, #9b51e0);
            color: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-explore:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }

        /* Toast de notificación interactivo */
        #toastContainer {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: rgba(18, 18, 30, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.3);
            color: #fff;
            padding: 0.9rem 1.4rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.9rem;
            animation: toastSlideIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), toastFadeOut 0.3s ease 2.7s forwards;
        }

        .toast i {
            color: #00d2ff;
            font-size: 1.1rem;
        }

        @keyframes toastSlideIn {
            from { transform: translateX(100%) scale(0.8); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        @keyframes toastFadeOut {
            to { transform: translateY(20px); opacity: 0; }
        }

        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            color: #707090;
            font-size: 0.9rem;
            position: relative;
            z-index: 2;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(5, 5, 8, 0.6);
            backdrop-filter: blur(10px);
        }

        /* Diseño Responsivo */
        @media (max-width: 768px) {
            .top-nav-bar {
                padding: 1rem;
                flex-direction: column;
                gap: 0.8rem;
            }
            .nav-controls {
                width: 100%;
                justify-content: space-between;
            }
            .search-box input {
                width: 150px;
            }
            .search-box input:focus {
                width: 180px;
            }
            header {
                padding-top: 10rem;
            }
            header h1 {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Barra de navegación superior completa -->
    <div class="top-nav-bar">
        <a href="../index.html" class="btn-home">
            <i class="fa-solid fa-arrow-left"></i> Volver al inicio
        </a>
        <div class="nav-controls">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Buscar favoritos..." oninput="filtrarFavoritos()">
            </div>
            <button class="btn-action-global" onclick="limpiarTodosFavoritos()" title="Eliminar todos los favoritos">
                <i class="fa-solid fa-trash-can"></i> Limpiar
            </button>
        </div>
    </div>

    <div class="bg-animation"></div>
    <canvas id="canvas3d"></canvas>

    <header>
        <h1>Mis Favoritos - WIBSIPROJECT</h1>
        <p>Tus elementos, módulos y herramientas preferidas guardadas y sincronizadas con almacenamiento persistente.</p>
    </header>

    <main class="container">
        <!-- Pestañas de filtrado por categoría -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="cambiarCategoria('todos', event)">Todos</button>
            <button class="tab-btn" onclick="cambiarCategoria('multimedia', event)">Multimedia</button>
            <button class="tab-btn" onclick="cambiarCategoria('sistema', event)">Sistema</button>
            <button class="tab-btn" onclick="cambiarCategoria('interfaz', event)">Interfaz</button>
        </div>

        <section class="favorites-grid" id="favoritesGrid">
            <!-- Los elementos favoritos se renderizarán dinámicamente aquí -->
        </section>
    </main>

    <!-- Contenedor dinámico de notificaciones Toast -->
    <div id="toastContainer"></div>

    <footer>
        <p>&copy; 2026 WIBSIPROJECT - Todos los derechos reservados.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Catálogo base de elementos disponibles para marcar como favoritos con categoría y enlace de acceso
        const catalogoElementos = [
            {
                id: 'mod_animaciones',
                titulo: '🎨 Animaciones y Gráficos 3D',
                categoria: 'interfaz',
                descripcion: 'Módulo de renderizado tridimensional en tiempo real utilizando Three.js y adaptación fluida al cursor.',
                enlace: '../index.html#animaciones'
            },
            {
                id: 'mod_funciones',
                titulo: '⚙️ Funciones e Interactividad',
                categoria: 'sistema',
                descripcion: 'Controles de estado inteligentes, flujos multimedia avanzados y gestión de visibilidad de pestañas.',
                enlace: '../index.html#funciones'
            },
            {
                id: 'mod_estructura',
                titulo: '🛡️ Estructura y Rendimiento',
                categoria: 'sistema',
                descripcion: 'Arquitectura modular limpia basada en Glassmorphism avanzado y alta optimización gráfica por hardware.',
                enlace: '../index.html#estructura'
            },
            {
                id: 'chat_wchat',
                titulo: '💬 Sistema de Comunicación Wchat',
                categoria: 'multimedia',
                descripcion: 'Plataforma integrada de chat en tiempo real con sincronización de perfiles y buzón de solicitudes.',
                enlace: '../index.html#wchat'
            }
        ];

        let categoriaActual = 'todos';
        let textoBusqueda = '';

        // Sistema de notificaciones Toast interactivas
        function mostrarToast(mensaje, icono = 'fa-circle-check') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid ${icono}"></i> <span>${mensaje}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // Obtener favoritos guardados en localStorage
        function obtenerFavoritos() {
            return JSON.parse(localStorage.getItem('wibsi_favoritos')) || [];
        }

        // Guardar favoritos en localStorage
        function guardarFavoritos(favoritos) {
            localStorage.setItem('wibsi_favoritos', JSON.stringify(favoritos));
        }

        // Cambiar categoría activa de los filtros
        function cambiarCategoria(categoria, event) {
            categoriaActual = categoria;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderizarFavoritos();
        }

        // Capturar valor de búsqueda en tiempo real
        function filtrarFavoritos() {
            textoBusqueda = document.getElementById('searchInput').value.toLowerCase();
            renderizarFavoritos();
        }

        // Renderizar la vista de favoritos con soporte de filtros y búsqueda
        function renderizarFavoritos() {
            const grid = document.getElementById('favoritesGrid');
            const idsFavoritos = obtenerFavoritos();
            
            let elementosFavoritos = catalogoElementos.filter(item => idsFavoritos.includes(item.id));

            // Filtrar por categoría seleccionada
            if (categoriaActual !== 'todos') {
                elementosFavoritos = elementosFavoritos.filter(item => item.categoria === categoriaActual);
            }

            // Filtrar por texto de búsqueda
            if (textoBusqueda.trim() !== '') {
                elementosFavoritos = elementosFavoritos.filter(item => 
                    item.titulo.toLowerCase().includes(textoBusqueda) || 
                    item.descripcion.toLowerCase().includes(textoBusqueda)
                );
            }

            grid.innerHTML = '';

            if (elementosFavoritos.length === 0) {
                if (idsFavoritos.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-regular fa-heart"></i>
                            <h3>No tienes favoritos guardados</h3>
                            <p>Explora los módulos principales de WIBSIPROJECT y haz clic en el icono de corazón para guardarlos y acceder rápidamente aquí.</p>
                            <a href="../index.html" class="btn-explore"><i class="fa-solid fa-compass"></i> Explorar plataforma</a>
                        </div>
                    `;
                } else {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-filter-circle-xmark"></i>
                            <h3>Sin resultados coincidentes</h3>
                            <p>No se encontraron elementos favoritos que coincidan con los filtros o la búsqueda actual.</p>
                        </div>
                    `;
                }
                return;
            }

            elementosFavoritos.forEach(item => {
                const card = document.createElement('div');
                card.className = 'fav-card';
                card.innerHTML = `
                    <div>
                        <div class="card-header-flex">
                            <h3>${item.titulo}</h3>
                            <span class="category-tag">${item.categoria}</span>
                        </div>
                        <p>${item.descripcion}</p>
                    </div>
                    <div class="card-actions">
                        <a href="${item.enlace}" class="btn-visit" title="Ir al módulo">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Ver módulo
                        </a>
                        <button class="heart-btn active" onclick="toggleFavorito('${item.id}', '${item.titulo}')" title="Quitar de favoritos">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Alternar el estado de favorito con animación y feedback visual
        function toggleFavorito(id, titulo) {
            let favoritos = obtenerFavoritos();
            const index = favoritos.indexOf(id);

            if (index > -1) {
                favoritos.splice(index, 1);
                mostrarToast(`"${titulo.replace(/^[^\w\s]+/, '').trim()}" eliminado de favoritos`, 'fa-heart-crack');
            } else {
                favoritos.push(id);
                mostrarToast(`"${titulo.replace(/^[^\w\s]+/, '').trim()}" añadido a favoritos`, 'fa-heart');
            }

            guardarFavoritos(favoritos);
            renderizarFavoritos();
        }

        // Limpiar todos los elementos favoritos con confirmación
        function limpiarTodosFavoritos() {
            const favoritos = obtenerFavoritos();
            if (favoritos.length === 0) {
                mostrarToast('No hay elementos favoritos para limpiar', 'fa-triangle-exclamation');
                return;
            }
            if (confirm('¿Estás seguro de que deseas eliminar todos los elementos de tus favoritos?')) {
                localStorage.removeItem('wibsi_favoritos');
                renderizarFavoritos();
                mostrarToast('Se han eliminado todos los favoritos', 'fa-trash');
            }
        }

        // Inicializar al cargar la página
        window.onload = function() {
            // Asegurar marcadores iniciales de prueba si el almacenamiento está completamente vacío (para lucir completo desde la primera visita)
            if (!localStorage.getItem('wibsi_favoritos')) {
                localStorage.setItem('wibsi_favoritos', JSON.stringify(['mod_animaciones', 'mod_funciones', 'chat_wchat']));
            }
            renderizarFavoritos();
        };

        // Configuración del fondo 3D con Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#canvas3d'), alpha: true, antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const geometry = new THREE.IcosahedronGeometry(2, 0);
        const material = new THREE.MeshStandardMaterial({
            color: 0xff007f,
            wireframe: true,
            roughness: 0.4,
            metalness: 0.8
        });

        const icosahedron = new THREE.Mesh(geometry, material);
        scene.add(icosahedron);

        const pointLight = new THREE.PointLight(0x00d2ff, 3, 50);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        camera.position.z = 6;

        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX / window.innerWidth) - 0.5;
            mouseY = (event.clientY / window.innerHeight) - 0.5;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            icosahedron.rotation.x = elapsedTime * 0.3 + mouseY * 0.6;
            icosahedron.rotation.y = elapsedTime * 0.4 + mouseX * 0.6;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
