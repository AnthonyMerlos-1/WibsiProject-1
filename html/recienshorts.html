<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recienshorts — WIBSIPROJECT</title>
<style>
    :root{
        --bg: #0a0a0f;
        --panel: rgba(18,18,24,0.92);
        --panel-2: rgba(255,255,255,0.05);
        --border: rgba(255,255,255,0.09);
        --accent: #6366f1;
        --accent-2: #8b5cf6;
        --accent-grad: linear-gradient(135deg,#6366f1,#a855f7);
        --text: #f3f4f6;
        --muted: #9ca3af;
        --danger: #f43f5e;
        --gold: #f59e0b;
        --radius: 14px;
        --shadow: 0 20px 50px rgba(0,0,0,0.55);
    }
    *{box-sizing:border-box;}
    html,body{
        margin:0;padding:0;
        background:var(--bg);
        color:var(--text);
        font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
        height:100%;
        overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none;}
    button{font-family:inherit;}

    /* Fondos ambientales */
    .ambient{
        position:fixed; z-index:0; border-radius:50%;
        filter:blur(120px); opacity:.35; pointer-events:none;
    }
    .ambient-one{
        width:520px;height:520px; top:-160px; left:-120px;
        background: radial-gradient(circle, var(--accent), transparent 70%);
    }
    .ambient-two{
        width:480px;height:480px; bottom:-140px; right:-120px;
        background: radial-gradient(circle, var(--accent-2), transparent 70%);
    }

    /* ---------- TOPBAR ---------- */
    .topbar{
        position:sticky; top:0; z-index:50;
        display:flex; align-items:center; justify-content:space-between;
        gap:16px; padding:14px 24px;
        background: rgba(10,10,15,0.72);
        backdrop-filter: blur(14px);
        border-bottom:1px solid var(--border);
    }
    .brand{ display:flex; align-items:center; gap:10px; cursor:pointer;}
    .brand-symbol{
        width:38px;height:38px;border-radius:10px;
        background:var(--accent-grad);
        display:flex;align-items:center;justify-content:center;
        font-weight:800; font-size:18px;
    }
    .brand-name{font-weight:800; letter-spacing:.5px; font-size:15px;}
    .brand-name span{color:var(--accent);}
    .brand-sub{font-size:10px; letter-spacing:2px; color:var(--muted);}
    .topbar-actions{display:flex; align-items:center; gap:10px;}
    .top-button{
        display:flex; align-items:center; gap:6px;
        background: var(--panel-2); border:1px solid var(--border);
        color:var(--text); padding:9px 14px; border-radius:10px;
        cursor:pointer; font-size:13px; font-weight:600;
        transition: all .2s ease;
    }
    .top-button:hover{ background: rgba(99,102,241,0.18); border-color: var(--accent);}
    .top-button.ghost{ background:transparent; }

    /* ---------- LAYOUT ---------- */
    .app{ display:flex; position:relative; z-index:1; min-height:calc(100vh - 66px); }

    .sidebar{
        width:230px; flex-shrink:0; padding:20px 14px;
        border-right:1px solid var(--border);
        position:sticky; top:66px; height:calc(100vh - 66px); overflow-y:auto;
    }
    .section-label{ font-size:11px; letter-spacing:1.5px; color:var(--muted); margin:14px 10px 8px;}
    .side-link{
        width:100%; display:flex; align-items:center; gap:10px;
        background:transparent; border:none; color:var(--text);
        padding:10px 12px; border-radius:10px; cursor:pointer;
        font-size:14px; text-align:left; margin-bottom:2px;
        transition: background .2s ease;
    }
    .side-link:hover{ background: var(--panel-2); }
    .side-link.active{ background: rgba(99,102,241,0.18); color:#c7d2fe; font-weight:600;}

    /* ---------- FEED ---------- */
    .feed-wrap{
        flex:1; display:flex; justify-content:center;
        padding:24px 16px 100px;
    }
    .feed{
        width:420px; max-width:100%;
        height: calc(100vh - 66px - 48px);
        overflow-y:scroll; scroll-snap-type: y mandatory;
        border-radius: 22px;
        scrollbar-width:none;
    }
    .feed::-webkit-scrollbar{ display:none; }

    .short-card{
        position:relative;
        height: calc(100vh - 66px - 48px);
        scroll-snap-align:start;
        border-radius:22px; overflow:hidden;
        background:#000;
        margin-bottom:16px;
        box-shadow: var(--shadow);
        border:1px solid var(--border);
    }
    .short-media-wrap{
        position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        background:#000;
    }
    .short-card video, .short-card iframe{
        width:100%; height:100%; object-fit:cover; border:none;
    }
    .fx-none{filter:none;}
    .fx-bn{filter:grayscale(1) contrast(1.1);}
    .fx-vintage{filter:sepia(.45) saturate(1.3) contrast(1.05);}
    .fx-brillo{filter:brightness(1.25) saturate(1.1);}
    .fx-contraste{filter:contrast(1.4) saturate(1.2);}
    .fx-frio{filter:hue-rotate(180deg) saturate(1.2);}
    .fx-vignette{ filter:contrast(1.15) brightness(.95); }

    .short-topfade{
        position:absolute; top:0; left:0; right:0; height:90px;
        background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
        pointer-events:none;
    }
    .short-botfade{
        position:absolute; bottom:0; left:0; right:0; height:230px;
        background:linear-gradient(to top, rgba(0,0,0,.82), transparent);
        pointer-events:none;
    }

    .kids-badge{
        position:absolute; top:14px; left:14px; z-index:5;
        background: rgba(245,158,11,0.9); color:#000;
        font-size:11px; font-weight:800; padding:5px 10px; border-radius:20px;
        display:flex; align-items:center; gap:4px;
    }
    .mute-badge{
        position:absolute; top:14px; right:14px; z-index:5;
        width:34px;height:34px; border-radius:50%;
        background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2);
        display:flex; align-items:center; justify-content:center;
        cursor:pointer; font-size:15px;
    }

    .short-info{
        position:absolute; left:16px; right:86px; bottom:20px; z-index:4;
    }
    .short-user{ display:flex; align-items:center; gap:8px; margin-bottom:8px;}
    .short-avatar{
        width:34px;height:34px;border-radius:50%;
        background:var(--accent-grad); display:flex;align-items:center;justify-content:center;
        font-weight:800; font-size:13px; border:2px solid #fff2;
    }
    .short-username{ font-weight:700; font-size:14px;}
    .short-title{ font-weight:700; font-size:15px; margin:0 0 4px; }
    .short-desc{ font-size:13px; color:#e5e7eb; opacity:.92; line-height:1.4;
        display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
    .short-tag{ font-size:11px; color:#c7d2fe; margin-top:6px; }

    .short-actions{
        position:absolute; right:10px; bottom:26px; z-index:5;
        display:flex; flex-direction:column; align-items:center; gap:18px;
    }
    .action-btn{
        background:transparent; border:none; color:#fff; cursor:pointer;
        display:flex; flex-direction:column; align-items:center; gap:4px;
        font-size:22px; filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
        transition: transform .15s ease;
    }
    .action-btn:active{ transform:scale(0.85); }
    .action-btn span.count{ font-size:11px; font-weight:700; color:#e5e7eb; filter:none;}
    .action-btn.liked{ color:var(--danger); }
    .action-btn.faved{ color:var(--gold); }

    .play-hint{
        position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        font-size:60px; color:#fff; opacity:0; pointer-events:none; z-index:6;
        transition:opacity .25s ease;
    }
    .play-hint.show{ opacity:.9; }

    .empty-feed{
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        height:100%; text-align:center; gap:14px; color:var(--muted); padding:30px;
    }
    .empty-feed .big{ font-size:44px; }
    .empty-feed a{
        background: var(--accent-grad); color:#fff; padding:10px 20px;
        border-radius:12px; font-weight:700; margin-top:10px; text-decoration:none;
    }

    /* ---------- TOAST ---------- */
    .toast{
        position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
        background: rgba(18,18,24,0.95); border:1px solid var(--border);
        color:#fff; padding:12px 20px; border-radius:12px; display:none;
        align-items:center; gap:10px; z-index:400; font-size:13.5px;
        box-shadow: var(--shadow); backdrop-filter: blur(10px);
    }
    .toast span{ color:#22c55e; font-weight:800; }

    @media (max-width: 900px){
        .sidebar{ display:none; }
        .feed{ width:100%; }
    }
    @media (max-width: 520px){
        .short-info{ right:76px; }
    }
</style>
</head>
<body>

<div class="ambient ambient-one"></div>
<div class="ambient ambient-two"></div>

<header class="topbar">
    <div class="brand" onclick="window.location.href='Wshorts.html'">
        <div class="brand-symbol">W</div>
        <div>
            <div class="brand-name">WIBSIPROJECT<span>.</span></div>
            <div class="brand-sub">RECIENSHORTS</div>
        </div>
    </div>
    <div class="topbar-actions">
        <button class="top-button ghost" onclick="window.location.href='Wshorts.html'">← Volver a Wshorts</button>
        <button class="top-button" id="btnMuteAll">🔊 Sonido</button>
    </div>
</header>

<div class="app">
    <aside class="sidebar">
        <div class="section-label">NAVEGACIÓN</div>
        <button class="side-link" onclick="window.location.href='index.html'"><span>⌂</span> Inicio</button>
        <button class="side-link" onclick="window.location.href='Wshorts.html'"><span>🎬</span> Wshorts</button>
        <button class="side-link active" onclick="window.location.href='recienshorts.html'"><span>🕒</span> Recienshorts</button>
    </aside>

    <div class="feed-wrap">
        <div class="feed" id="feed"></div>
    </div>
</div>

<div class="toast" id="toast">
    <span>✓</span>
    <p id="toastMsg">Listo</p>
</div>

<script>
/* =========================================================
   RECIENSHORTS — Sincronizado con Wshorts.html vía localStorage
   ========================================================= */
const STORAGE_KEY = 'wibsitihub_wshorts_data';

function mostrarToast(msg){
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    toast.style.display = 'flex';
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> toast.style.display='none', 2600);
}

function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
}

function cargarRecientes(){
    const feed = document.getElementById('feed');
    feed.innerHTML = '';

    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw){
            mostrarVacio(feed);
            return;
        }
        
        let shorts = JSON.parse(raw);
        // Ordenar del más reciente al más antiguo basándose en el ID (que funciona como timestamp)
        shorts.sort((a, b) => b.id - a.id);

        if(shorts.length === 0){
            mostrarVacio(feed);
            return;
        }

        shorts.forEach(s => feed.appendChild(crearCardShort(s)));
        setupObserver();

    } catch(e) {
        mostrarVacio(feed);
    }
}

function mostrarVacio(feed){
    feed.innerHTML = `
        <div class="empty-feed">
            <div class="big">🕒</div>
            <div>No hay ningún short agregado todavía.<br>Sube shorts nuevos en Wshorts para verlos aquí en orden cronológico.</div>
            <a href="Wshorts.html">Ir a Wshorts</a>
        </div>
    `;
}

function crearCardShort(s){
    const card = document.createElement('div');
    card.className = 'short-card';
    card.dataset.id = s.id;

    const mediaWrap = document.createElement('div');
    mediaWrap.className = 'short-media-wrap';

    if(s.tipo === 'youtube' && s.ytId){
        const params = new URLSearchParams({
            autoplay:0, mute:1, loop:1, playlist:s.ytId, controls:0,
            modestbranding:1, playsinline:1, rel:0
        });
        const iframe = document.createElement('iframe');
        iframe.src = `https://www.youtube.com/embed/${s.ytId}?${params.toString()}`;
        iframe.allow = "autoplay; encrypted-media; picture-in-picture";
        iframe.className = s.efecto || 'fx-none';
        mediaWrap.appendChild(iframe);
    } else {
        const video = document.createElement('video');
        video.src = s.src;
        video.loop = false;
        video.muted = true;
        video.playsInline = true;
        video.className = s.efecto || 'fx-none';
        video.preload = 'metadata';
        video.addEventListener('ended', () => { video.currentTime = 0; video.play().catch(()=>{}); });
        mediaWrap.appendChild(video);
    }
    card.appendChild(mediaWrap);

    card.innerHTML += `
        <div class="short-topfade"></div>
        <div class="short-botfade"></div>
        ${s.kids ? `<div class="kids-badge">👶 Para niños</div>` : ''}
        <div class="mute-badge" onclick="toggleMuteCard(event,'${s.id}')">🔇</div>
        <div class="play-hint" id="hint-${s.id}">▶</div>

        <div class="short-info">
            <div class="short-user">
                <div class="short-avatar">${(s.usuario||'W').substring(0,2).toUpperCase()}</div>
                <span class="short-username">${s.usuario || 'Anónimo'}</span>
            </div>
            <div class="short-title">${escapeHtml(s.titulo)}</div>
            <div class="short-desc">${escapeHtml(s.descripcion||'')}</div>
            <div class="short-tag">✦ Recienshorts</div>
        </div>

        <div class="short-actions">
            <button class="action-btn ${s.liked?'liked':''}" onclick="toggleLike('${s.id}')" title="Dar like">
                <span class="ic">${s.liked?'💖':'🤍'}</span>
                <span class="count">${s.likes}</span>
            </button>
            <button class="action-btn ${s.faved?'faved':''}" onclick="toggleFav('${s.id}')" title="Favorito">
                <span class="ic">⭐</span>
                <span class="count">Fav</span>
            </button>
        </div>
    `;

    card.addEventListener('click', (e) => {
        if(e.target.closest('.short-actions') || e.target.closest('.mute-badge')) return;
        togglePlayPause(card);
    });

    return card;
}

function setupObserver(){
    const cards = document.querySelectorAll('.short-card');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const media = entry.target.querySelector('video, iframe');
            if(!media) return;
            if(entry.isIntersecting && entry.intersectionRatio > 0.7){
                if(media.tagName === 'VIDEO') media.play().catch(()=>{});
            } else {
                if(media.tagName === 'VIDEO') media.pause();
            }
        });
    }, { threshold: [0, 0.7, 1] });
    cards.forEach(c => observer.observe(c));
}

function togglePlayPause(card){
    const media = card.querySelector('video');
    const hint = card.querySelector('.play-hint');
    if(!media) return;
    if(media.paused){
        media.play().catch(()=>{});
        hint.textContent = '▶️'; hint.classList.add('show');
    } else {
        media.pause();
        hint.textContent = '⏸️'; hint.classList.add('show');
    }
    setTimeout(()=> hint.classList.remove('show'), 500);
}

function toggleMuteCard(event, id){
    event.stopPropagation();
    const card = document.querySelector(`.short-card[data-id="${id}"]`);
    const video = card.querySelector('video');
    const badge = card.querySelector('.mute-badge');
    if(video){
        video.muted = !video.muted;
        badge.textContent = video.muted ? '🔇' : '🔊';
        mostrarToast(video.muted ? "Silenciado 🔇" : "Sonido activado 🔊");
    }
}

function toggleLike(id){
    try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return;
        let shorts = JSON.parse(raw);
        shorts = shorts.map(s => {
            if(s.id == id) {
                s.liked = !s.liked;
                s.likes += s.liked ? 1 : -1;
            }
            return s;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(shorts));
        cargarRecientes();
        mostrarToast("Like actualizado ❤️");
    } catch(e) {}
}

function toggleFav(id){
    try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return;
        let shorts = JSON.parse(raw);
        shorts = shorts.map(s => {
            if(s.id == id) {
                s.faved = !s.faved;
            }
            return s;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(shorts));
        cargarRecientes();
        mostrarToast("Favorito actualizado ⭐");
    } catch(e) {}
}

document.getElementById('btnMuteAll').addEventListener('click', function(){
    const videos = document.querySelectorAll('.short-card video');
    const anyUnmuted = Array.from(videos).some(v => !v.muted);
    videos.forEach(v => v.muted = anyUnmuted);
    this.textContent = anyUnmuted ? '🔇 Sonido' : '📢 Sonido';
    mostrarToast(anyUnmuted ? "Videos silenciados 🔇" : "Sonido activado 📢");
});

cargarRecientes();
</script>
</body>
</html>
